spring.application.name=shelter
# --- Datasource (env-overridable for k8s; localhost defaults for local dev) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelter}
spring.datasource.username=${DB_USER:shelter}
spring.datasource.password=${DB_PASSWORD:shelter}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Batch-fetch lazy associations: initialize up to N parents' collections per IN query
# (turns N+1 into ~ceil(parents/N) queries). N counts owner entities, not children.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# --- RSA ---
rsa.private-key=${RSA_PRIVATE_KEY:classpath:certs/privateKey.pem}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:certs/publicKey.pem}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
shelter.kafka.replicas=${KAFKA_REPLICAS:1}