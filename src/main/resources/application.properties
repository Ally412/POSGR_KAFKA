spring.application.name=shelter
# --- Datasource (env-overridable for k8s; localhost defaults for local dev) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelter}
spring.datasource.username=${DB_USER:shelter}
spring.datasource.password=${DB_PASSWORD:shelter}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Batch-fetch lazy associations: initialize up to N parents' collections per IN query
# (turns N+1 into ~ceil(parents/N) queries). N counts owner entities, not children.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# --- RSA ---
rsa.private-key=${RSA_PRIVATE_KEY:classpath:certs/privateKey.pem}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:certs/publicKey.pem}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Keys stay plain strings (the animal id); values are JSON event objects.
# Jackson 3 lives in tools.jackson, so the serializer is JacksonJsonSerializer —
# the older JsonSerializer needs Jackson 2 databind, which Boot 4 no longer ships.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Don't stamp the producer's class name into a __TypeId__ header: the consumer is a
# separate app that has no such class. The wire format is JSON, not our package layout.
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# read from the start of the topic so a late-joining consumer still sees the message
spring.kafka.consumer.auto-offset-reset=earliest
shelter.kafka.replicas=${KAFKA_REPLICAS:1}